<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>AI Knowledge Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  input, textarea, select { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
  button { padding: 8px 16px; cursor: pointer; margin-top: 4px; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin: 12px 0; }
  .answer { background: #f5f5f5; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  li { margin-bottom: 6px; }
  .doc-row { display: flex; justify-content: space-between; align-items: center; }
  .doc-row button { margin: 0 0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = "http://localhost:8080";

function App() {
  const [token, setToken] = useState(localStorage.getItem("token") || "");
  return token ? <Dashboard token={token} logout={() => { localStorage.removeItem("token"); setToken(""); }} />
               : <AuthForm onAuth={(t) => { localStorage.setItem("token", t); setToken(t); }} />;
}

function AuthForm({ onAuth }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    setError("");
    const url = mode === "login" ? "/login" : "/signup";
    const res = await fetch(API + url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.token) onAuth(data.token); else setError(data.error || "failed");
  }

  return (
    <div className="card">
      <h2>{mode === "login" ? "Log in" : "Sign up"}</h2>
      <form onSubmit={submit}>
        <input placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required />
        <input placeholder="Password" type="password" value={password} onChange={e => setPassword(e.target.value)} required />
        <button type="submit">{mode === "login" ? "Log in" : "Sign up"}</button>
      </form>
      {error && <p style={{ color: "red" }}>{error}</p>}
      <p onClick={() => setMode(mode === "login" ? "signup" : "login")} style={{ cursor: "pointer", color: "blue" }}>
        {mode === "login" ? "Need an account? Sign up" : "Already have an account? Log in"}
      </p>
    </div>
  );
}

function Dashboard({ token, logout }) {
  const [docs, setDocs] = useState([]);
  const [title, setTitle] = useState("");
  const [content, setContent] = useState("");
  const [question, setQuestion] = useState("");
  const [selectedDoc, setSelectedDoc] = useState("");
  const [answer, setAnswer] = useState("");
  const [loading, setLoading] = useState(false);
  const [summaries, setSummaries] = useState({});

  const authHeaders = { "Content-Type": "application/json", Authorization: "Bearer " + token };

  async function loadDocs() {
    const res = await fetch(API + "/api/documents", { headers: authHeaders });
    const data = await res.json();
    setDocs(data.documents || []);
  }
  useEffect(() => { loadDocs(); }, []);

  async function upload(e) {
    e.preventDefault();
    await fetch(API + "/api/documents", { method: "POST", headers: authHeaders, body: JSON.stringify({ title, content }) });
    setTitle(""); setContent(""); loadDocs();
  }

  async function ask(e) {
    e.preventDefault();
    setLoading(true); setAnswer("");
    const res = await fetch(API + "/api/ask", {
      method: "POST", headers: authHeaders,
      body: JSON.stringify({ question, doc_id: selectedDoc ? parseInt(selectedDoc) : null })
    });
    const data = await res.json();
    setAnswer(data.answer || data.error);
    setLoading(false);
  }

  async function summarize(id) {
    const res = await fetch(API + `/api/documents/${id}/summarize`, { method: "POST", headers: authHeaders });
    const data = await res.json();
    setSummaries(s => ({ ...s, [id]: data.summary || data.error }));
  }

  return (
    <div>
      <button onClick={logout} style={{ float: "right" }}>Log out</button>
      <h2>AI Knowledge Assistant</h2>

      <div className="card">
        <h3>Ask a question</h3>
        <form onSubmit={ask}>
          <select value={selectedDoc} onChange={e => setSelectedDoc(e.target.value)}>
            <option value="">Across all documents (most recent 5)</option>
            {docs.map(d => <option key={d.id} value={d.id}>{d.title}</option>)}
          </select>
          <input placeholder="Ask a question..." value={question} onChange={e => setQuestion(e.target.value)} required />
          <button type="submit" disabled={loading}>{loading ? "Thinking..." : "Ask"}</button>
        </form>
        {answer && <div className="answer" style={{ marginTop: 10 }}>{answer}</div>}
      </div>

      <div className="card">
        <h3>Upload a document</h3>
        <form onSubmit={upload}>
          <input placeholder="Title" value={title} onChange={e => setTitle(e.target.value)} required />
          <textarea placeholder="Paste document text..." rows="4" value={content} onChange={e => setContent(e.target.value)} required />
          <button type="submit">Upload</button>
        </form>
      </div>

      <div className="card">
        <h3>Your documents</h3>
        <ul>
          {docs.map(d => (
            <li key={d.id}>
              <div className="doc-row">
                <span>{d.title}</span>
                <button onClick={() => summarize(d.id)}>Summarize</button>
              </div>
              {summaries[d.id] && <div className="answer" style={{ marginTop: 6 }}>{summaries[d.id]}</div>}
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
